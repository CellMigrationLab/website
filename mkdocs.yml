site_name: Cell Migration Lab
site_description: The Cell Migration Lab (Jacquemet lab) studies how cells move and interact with their environment using microscopy and image analysis. Åbo Akademi University and Turku Bioscience Centre, Turku, Finland.
site_author: Cell Migration Lab
# Change to https://cellmig.org/ when the domain points to GitHub Pages (see README).
site_url: https://cellmigrationlab.github.io/website/
repo_url: https://github.com/CellMigrationLab/website
repo_name: CellMigrationLab/website
edit_uri: edit/main/docs/
copyright: © Cell Migration Lab · Åbo Akademi University & Turku Bioscience Centre
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false          # Inter and Bodoni Moda are self-hosted in docs/assets/fonts
  favicon: wp-content/uploads/2019/08/cropped-cover4-1.jpg
  logo: wp-content/uploads/2023/02/g2198-8.png
  features:
    - content.action.edit
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    scheme: default
    primary: custom
    accent: custom

# Short labels for the top menu. Pages generated by scripts/build_pages.py
# (see data/) are listed here like normal pages. Gallery, Online talks and
# ZeroCostDL4Mic are linked from About us instead (same addresses).
nav:
  - Home: index.md
  - News: news.md
  - Research: research.md
  - Publications: publications.md
  - Software: software.md
  - Datasets: datasets.md
  - Members: lab-members.md
  - In numbers: lab-in-numbers.md
  - About: about-us.md
  - Join us: join-us.md

plugins:
  - search
  # Old WordPress addresses that have no page of their own any more.
  - redirects:
      redirect_maps:
        portfolio/index.md: featured-research.md
        portfolio/structural-repetition-detector-multi-scale-quantitative-mapping-of-molecular-complexes-through-microscopy.md: publications.md
        portfolio/photofitt-a-quantitative-framework-for-assessing-phototoxicity-in-live-cell-microscopy-experiments.md: publications.md
        portfolio/talin-rod-domain-containing-protein-1-tlnrd1-is-a-novel-actin-bundling-protein-which-promotes-filopodia-formation.md: publications.md
        portfolio/filopodia-cocb.md: publications.md
        portfolio/cdm.md: publications.md
        collaborators.md: lab-in-numbers.md
        author/guijacquemet/index.md: about-us.md
        category/uncategorized/index.md: index.md
        2021/09/16/phd-position-available.md: lab-members.md
        2019/10/11/we-are-ready-to-move.md: about-us.md
        home-2/index.md: index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - smarty
  - toc:
      permalink: false

extra_css:
  - assets/stylesheets/cellmig.css
extra_javascript:
  - assets/javascripts/cellmig.js

validation:
  nav:
    omitted_files: info
  links:
    absolute_links: ignore
