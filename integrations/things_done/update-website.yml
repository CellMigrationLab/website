# Copy this file to the things_done repository as
#   .github/workflows/update-website.yml
#
# After every change to publications, software or datasets in the ledger, it
# exports the public fields to the lab website (CellMigrationLab/website,
# data/things_done/) and pushes them. The website then rebuilds by itself.
#
# One-time setup (see integrations/things_done/README.md in the website repo):
#   things_done → Settings → Secrets and variables → Actions → New secret
#   WEBSITE_TOKEN = fine-grained token with "Contents: read and write" on
#                   CellMigrationLab/website only.

name: Update lab website

on:
  push:
    branches: [ main ]
    paths:
      - 'ledger/publications/**'
      - 'ledger/registries/software.yaml'
      - 'ledger/registries/datasets.yaml'
  # Commits made by the ledger's own automation (GITHUB_TOKEN) do not trigger
  # "push" workflows, so also run after the cleanup workflow, and once a day.
  workflow_run:
    workflows: [ "Ledger Cleanup and Preprint Links" ]
    types: [ completed ]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: update-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the ledger
        uses: actions/checkout@v4
        with:
          ref: main
          path: things_done

      - name: Check out the website
        uses: actions/checkout@v4
        with:
          repository: CellMigrationLab/website
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export public ledger data
        run: |
          pip install PyYAML==6.0.3
          python website/scripts/sync_things_done.py --ledger things_done

      - name: Push to the website if something changed
        working-directory: website
        run: |
          if git diff --quiet -- data/things_done; then
            echo "Website already up to date."
            exit 0
          fi
          git config user.name "things_done bot"
          git config user.email "things-done-bot@users.noreply.github.com"
          git add data/things_done
          git commit -m "Update publications, software and datasets from things_done" \
                     -m "things_done commit: ${{ github.repository }}@${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
