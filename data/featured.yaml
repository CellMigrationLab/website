# Pictures (and page addresses) for Featured research. The home page shows the
# 8 newest biology papers and the 8 newest methods papers, /featured-research/
# shows all of them, and each has its own page at /portfolio/<slug>/.
#
# Title, authors, journal, abstract and links all come from the things_done
# ledger (by DOI). Here you only choose the picture.
#
#   doi:    the paper (journal version or preprint; a preprint's journal version
#           is used automatically when the ledger links them)
#   area:   biology or methods (computational and imaging tools); required,
#           so a new corresponding-author paper stops the build until it has one
#   image:  picture or logo (a .gif plays as a short video)
#   fit:    (optional) contain for a logo or diagram (shown whole in the square
#           card); pictures fill the card (cover) otherwise
#   slug:   page address; kept from the old website - leave unchanged
#   also:   other DOIs told by the same story (optional)
#   hide:   true to leave a corresponding-author paper out
#   summary: the page text, for a paper with no abstract in the ledger (an
#           editorial, say); the build stops if such a paper has none
#
# Featured research is every paper where Guillaume is (co-)corresponding author
# in the ledger, and only those: an entry for any other paper stops the build. Papers without a picture show the journal name instead: add
# them below with an image to make the grid look nice.


