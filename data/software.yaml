# How each software project looks on https://cellmig.org/software/
#
# The list of projects and their facts come from the things_done ledger
# (ledger/registries/software.yaml, synced to data/things_done/software.yaml):
# name, year, GitHub link, paper DOIs (a preprint is followed to its journal
# version once published) and the text shown next to the picture (`summary`).
# This file only adds the look; giving a fact here stops the build.
#
#   id:      the project id in the ledger
#   image:   picture or logo shown next to the text (a .gif is played as a video);
#            without image or video, the project shows the picture of its paper
#            in data/featured.yaml (any version of the paper), so it is kept once
#   video:   short video file instead of a picture (in docs/assets/media/)
#   fit:     (optional) contain for a logo, screenshot or drawing (shown whole,
#            with a margin); pictures fill the tile (cover) otherwise
#   links:   extra links, shown as buttons after the code and paper buttons
#
# The page is newest year first and, within a year, in this file's order. A
# project in the ledger but not here is still shown, as text only; a new
# project is added to the ledger, not here.

