name: Guillaume Jacquemet
title: Professor in Bioimaging
short_bio: 'Guillaume Jacquemet is Professor in Bioimaging at [Åbo Akademi University](https://www.abo.fi/en/)
  and leads the Cell Migration Lab at [Turku Bioscience Centre](https://bioscience.fi/). His research
  focuses on cell migration, cancer-cell interactions with the vasculature, filopodia and quantitative
  microscopy. He trained with Martin Humphries at the University of Manchester and Johanna Ivaska at the
  University of Turku.


  He holds a [K. Albin Johansson Research Professorship](https://www.syopainstituutti.com/researcher-positions/granted-positions)
  of the Finnish Cancer Institute and is an Associate Editor at [Journal of Cell Science](https://journals.biologists.com/jcs)
  for bioimaging and image-analysis papers. He is also one of the heads of [AIC-Turku](https://bioscience.fi/aic/)
  and heads the [Doctoral Programme in Biosciences and Drug Research](https://www.abo.fi/en/research-at-aau/postgraduate-and-doctoral-studies/doctoral-programmes-at-abo-akademi-university/doctoral-programme-in-bio-drug-research/)
  at Åbo Akademi University.'
