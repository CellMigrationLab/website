  title: Rac1 is deactivated at integrin activation sites via an IQGAP1/filamin-A/RacGAP1 pathway
  authors:
  - Guillaume Jacquemet
  - Mark R. Morgan
  - Adam Byron
  - Jonathan D. Humphries
  - Colin K. Choi
  - Christopher S. Chen
  - Patrick T. Caswell
  - Martin J. Humphries
  venue: Journal of Cell Science
  abstract: Cell migration makes a fundamental contribution to both normal physiology and disease pathogenesis.
    Integrin engagement with extracellular ligands spatially controls, via the cyclical activation and
    deactivation of the small GTPase Rac1, the dynamic membrane protrusion and cytoskeletal reorganization
    events that are required for directional migration. While the pathways that control integrin-mediated
    Rac1 activation are reasonably well defined, the mechanisms that are responsible for switching off
    activity are poorly understood. Here, proteomic analyses of activated integrin-associated complexes
    suggested filamin-A and IQ motif-containing GTPase activating protein 1 (IQGAP1) as candidates that
    might link β1 integrin to Rac1. siRNA-mediated knock down of either filamin-A or IQGAP1 induced high,
    dysregulated Rac1 activity during cell spreading on fibronectin. Using immunoprecipitation and immunocytochemistry,
    filamin-A and IQGAP1 were shown to be part of a complex that is recruited to active β1 integrin. Mass
    spectrometric analyses of individual filamin-A, IQGAP1 and Rac1 pull-downs, following by biochemical
    analyses, identified RacGAP1 as a novel IQGAP1 binding partner. Further immunoprecipitation and immunocytochemistry
    analyses demonstrated RacGAP1 recruitment to IQGAP1 and to active β1 integrin, and suppression of
    RacGAP1 expression triggered elevated Rac1 activity during spreading on fibronectin. Consistent with
    these findings, reduced expression of filamin-A, IQGAP1 or RacGAP1 triggered unconstrained membrane
    protrusion and disrupted directional cell migration on fibrillar extracellular matrices. These findings
    lead to a model whereby integrin engagement, followed by filamin-A, IQGAP1 and RacGAP1 recruitment,
    deactivates Rac1 to constrain its activity spatially and thereby co-ordinate directional cell migration.
