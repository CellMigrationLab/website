  title: Talin mechanosensitivity is modulated by a direct interaction with cyclin-dependent kinase-1
  authors:
  - Rosemarie E. Gough
  - Matthew C. Jones
  - Thomas Zacharchenko
  - Shimin Le
  - Miao Yu
  - Guillaume Jacquemet
  - Ste P. Muench
  - Jie Yan
