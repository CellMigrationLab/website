  venue: Nature Methods
  abstract: The expanding scale and complexity of microscopy image datasets require accelerated analytical
    workflows. NanoPyx meets this need through an adaptive framework enhanced for high-speed analysis.
    At the core of NanoPyx, the Liquid Engine dynamically generates optimized central processing unit
    and graphics processing unit code variations, learning and predicting the fastest based on input data
    and hardware. This data-driven optimization achieves considerably faster processing, becoming broadly
    relevant to reactive microscopy and computing fields requiring efficiency.
