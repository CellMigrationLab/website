  venue: The Biochemist
  abstract: Artificial intelligence (AI)-powered algorithms are now influencing many aspects of our day-to-day
    life, from providing movies/music recommendations to controlling self-driving cars. These algorithms
    are also increasingly used in the lab to aid biomedical research. In particular, the ability to analyse
    and process images using AI is slowly revolutionizing the quality and quantity of data we collect
    from microscopy images. In fact, AI-based algorithms can now be applied to perform virtually any high-performance
    image analysis tasks such as classifying images, detecting and segmenting objects, aligning images
    or improving image quality by removing noise or increasing image resolution. This short feature article
    briefly underlies the principles behind using AI algorithms to analyse microscopy images with a specific
    focus on segmentation and denoising.
