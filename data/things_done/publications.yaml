  title: Practical recommendations for developing software for life science applications
  authors:
  - Joanna W. Pylvänäinen
  - Guillaume Jacquemet
  - Stefania Marcotti
  venue: Journal of Cell Science
  abstract: Developing user-friendly image analysis software is essential for advancing biological and
    life science research. However, the interdisciplinary gap between software developers and life scientists
    presents challenges to software adoption. In this Essay, we provide practical recommendations to guide
    bioimage analysts and developers in creating accessible and usable software for biological research.
    These recommendations are presented in three phases, covering software design, user involvement in
    early development stages and the importance of software dissemination. Additionally, two software
    development case studies are presented to highlight the practical application of these principles,
    showing how thoughtful development, user-centric design and thorough documentation can bridge the
    gap between software developers and biologists, fostering wider adoption of the software and enabling
    further scientific discovery.
