  venue: bioRxiv
  abstract: Talin is a mechanosensitive adapter protein which couples integrins to the cytoskeleton and
    regulates integrin-mediated adhesion. Talin rod domain-containing protein-1 (TLNRD1) shares 22% homology
    with the R7R8 domains of talin, and is highly conserved throughout vertebrate evolution, however little
    is known about its function. Here we show that TLNRD1 is an α-helical protein which shares the same
    atypical topology as talin R7R8, but forms a novel antiparallel dimer arrangement. Actin co-sedimentation
    assays and electron microscopy reveal TLNRD1 is an actin-bundling protein that forms tight actin bundles.
    In addition, TLNRD1 binds to the same LD-motif containing proteins, RIAM and KANK, as talin, and thus
    may act in competition with talin. Filopodia are cell protrusions supported by tightly bundled actin
    filaments and TLNRD1 localises to filopodia tips, increases filopodia number and promotes cell migration
    in 2D. Together our results suggest that TLNRD1 has similar functionality to talin R7R8, serving as
    a nexus between the actin and microtubule cytoskeletons independent of adhesion complexes.
