  title: SHANK3 depletion leads to ERK signalling overdose and cell death in KRAS-mutant cancers
  authors:
  - Johanna Lilja
  - Jasmin Kaivola
  - James R. W. Conway
  - Joni Vuorio
  - Hanna Parkkola
  - Pekka Roivas
