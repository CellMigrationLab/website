  - Johanna Ivaska
  venue: Nature Communications
  abstract: The KRAS oncogene drives many common and highly fatal malignancies. These include pancreatic,
    lung, and colorectal cancer, where various activating KRAS mutations have made the development of
    KRAS inhibitors difficult. Here we identify the scaffold protein SH3 and multiple ankyrin repeat domain
    3 (SHANK3) as a RAS interactor that binds active KRAS, including mutant forms, competes with RAF and
    limits oncogenic KRAS downstream signalling, maintaining mitogen-activated protein kinase/extracellular
    signal-regulated kinase (MAPK/ERK) activity at an optimal level. SHANK3 depletion breaches this threshold,
    triggering MAPK/ERK signalling hyperactivation and MAPK/ERK-dependent cell death in KRAS-mutant cancers.
    Targeting this vulnerability through RNA interference or nanobody-mediated disruption of the SHANK3-KRAS
    interaction constrains tumour growth in vivo in female mice. Thus, inhibition of SHANK3-KRAS interaction
    represents an alternative strategy for selective killing of KRAS-mutant cancer cells through excessive
    signalling.
