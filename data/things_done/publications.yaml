  title: Filopodia-mediated trans-endocytosis
  authors:
  - Hanna Grobe
  - Marcela Xiomara Rivera Pineda
  - Sujan Ghimire
  - Marie-Catherine Laisne
  - Anna Nylund
  - Monika Vaitkevičiūtė
