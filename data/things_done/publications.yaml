  venue: The EMBO Journal
  abstract: SHARPIN is a widely expressed multifunctional protein implicated in cancer, inflammation,
    linear ubiquitination and integrin activity inhibition; however, its contribution to epithelial homeostasis
    remains poorly understood. Here, we examined the role of SHARPIN in mammary gland development, a process
    strongly regulated by epithelial-stromal interactions. Mice lacking SHARPIN expression in all cells
    (Sharpin cpdm ), and mice with a stromal (S100a4-Cre) deletion of Sharpin, have reduced mammary ductal
    outgrowth during puberty. In contrast, Sharpin cpdm mammary epithelial cells transplanted in vivo
    into wild-type stroma, fully repopulate the mammary gland fat pad, undergo unperturbed ductal outgrowth
    and terminal differentiation. Thus, SHARPIN is required in mammary gland stroma during development.
    Accordingly, stroma adjacent to invading mammary ducts of Sharpin cpdm mice displayed reduced collagen
    arrangement and extracellular matrix (ECM) stiffness. Moreover, Sharpin cpdm mammary gland stromal
    fibroblasts demonstrated defects in collagen fibre assembly, collagen contraction and degradation
    in vitro Together, these data imply that SHARPIN regulates the normal invasive mammary gland branching
    morphogenesis in an epithelial cell extrinsic manner by controlling the organisation of the stromal
    ECM.
