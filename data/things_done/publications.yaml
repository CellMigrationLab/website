  title: Defining the phospho-adhesome through the phosphoproteomic analysis of integrin signalling
  authors:
  - Joseph Robertson
  - Guillaume Jacquemet
  - Adam Byron
  - Matthew C. Jones
  - Stacey Warwood
  - Julian N. Selley
