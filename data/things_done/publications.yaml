  title: Superresolution architecture of cornerstone focal adhesions in human pluripotent stem cells
  authors:
  - Aki Stubb
  - Camilo Guzmán
  - Elisa Närvä
  - Jesse Aaron
  - Teng-Leong Chew
  - Markku Saari
  - Mitro Miihkinen
