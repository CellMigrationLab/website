  title: Regulation of cell dynamics by rapid integrin transport through the biosynthetic pathway
  authors:
  - Martina Lerche
  - Mathilde Mathieu
  - Hellyeh Hamidi
  - Megan Chastney
  - Guillaume Jacquemet
  - Bart Marlon Herwig Bruininks
  - Shreyas Kaptan
