  abstract: The resources and expertise needed to use Deep Learning (DL) in bioimaging remain significant
    barriers for most laboratories. We present ZeroCostDL4Mic, a platform simplifying access to DL by
    exploiting the free, cloud-based computational resources of Google Colab. ZeroCostDL4Mic allows researchers
