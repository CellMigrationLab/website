  venue: bioRxiv
  abstract: Spatially controlled, cargo-specific endocytosis is essential for development, tissue homeostasis,
    and cancer invasion and is often hijacked by viral infections 1 . Unlike clathrin-mediated endocytosis,
    which exploits cargo-specific adaptors for selective protein internalization, the clathrin and dynamin-independent
    endocytic pathway (CLIC-GEEC, CG-pathway) has until now been considered a bulk internalization route
    for the fluid phase, glycosylated membrane proteins and lipids 2,3 . Although the core molecular players
    of CG endocytosis have been recently defined, no cargo-specific adaptors are known and evidence of
    selective protein uptake into the pathway is lacking 3 . Here, we identify the first cargo-specific
    adaptor for CG-endocytosis and demonstrate its clinical relevance in breast cancer progression. By
    combining unbiased molecular characterization and super-resolution imaging, we identified the actin-binding
    protein swiprosin-1 (EFHD2) as a cargo-specific adaptor regulating integrin internalization via the
    CG-pathway. Swiprosin-1 couples active Rab21-associated integrins with key components of the CG-endocytic
    machinery, IRSp53 and actin. Swiprosin-1 is critical for integrin endocytosis, but not for other CG-cargo
    and supports integrin-dependent cancer cell migration and invasion, with clinically relevant implications
    for breast cancer. Our results demonstrate a previously unknown cargo selectivity for the CG-pathway
    and opens the possibility to discover more adaptors regulating it.
