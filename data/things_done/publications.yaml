  title: α5β1 integrin recycling promotes Arp2/3-independent cancer cell invasion via the formin FHOD3
  authors:
  - Nikki R. Paul
  - Jennifer L. Allen
  - Anna Chapman
  - Maria Morlan-Mairal
  - Egor Zindy
  - Guillaume Jacquemet
  - Laura Fernandez del Ama
  - Nermina Ferizovic
  - David M. Green
  - Jonathan D. Howe
  - Elisabeth Ehler
  - Adam Hurlstone
  - Patrick T. Caswell
  venue: Journal of Cell Biology
  abstract: Invasive migration in 3D extracellular matrix (ECM) is crucial to cancer metastasis, yet little
    is known of the molecular mechanisms that drive reorganization of the cytoskeleton as cancer cells
    disseminate in vivo. 2D Rac-driven lamellipodial migration is well understood, but how these features
    apply to 3D migration is not clear. We find that lamellipodia-like protrusions and retrograde actin
    flow are indeed observed in cells moving in 3D ECM. However, Rab-coupling protein (RCP)-driven endocytic
    recycling of α5β1 integrin enhances invasive migration of cancer cells into fibronectin-rich 3D ECM,
    driven by RhoA and filopodial spike-based protrusions, not lamellipodia. Furthermore, we show that
    actin spike protrusions are Arp2/3-independent. Dynamic actin spike assembly in cells invading in
    vitro and in vivo is regulated by Formin homology-2 domain containing 3 (FHOD3), which is activated
    by RhoA/ROCK, establishing a novel mechanism through which the RCP–α5β1 pathway reprograms the actin
    cytoskeleton to promote invasive migration and local invasion in vivo.
