  venue: Nature Communications
  abstract: Angiopoietins regulate vascular homeostasis via the endothelial Tie receptor tyrosine kinases.
    Angiopoietin-1 (Ang1) supports endothelial stabilization via Tie2 activation. Angiopoietin-2 (Ang2)
    functions as a context-dependent Tie2 agonist/antagonist promoting pathological angiogenesis, vascular
    permeability and inflammation. Elucidating Ang2-dependent mechanisms of vascular destablization is
    critical for rational design of angiopoietin antagonists that have demonstrated therapeutic efficacy
    in cancer trials. Here, we report that Ang2, but not Ang1, activates β1-integrin, leading to endothelial
    destablization. Autocrine Ang2 signalling upon Tie2 silencing, or in Ang2 transgenic mice, promotes
    β1-integrin-positive elongated matrix adhesions and actin stress fibres, regulating vascular endothelial-cadherin-containing
    cell–cell junctions. The Tie2-silenced monolayer integrity is rescued by β1-integrin, phosphoinositide-3
    kinase or Rho kinase inhibition, and by re-expression of a membrane-bound Tie2 ectodomain. Furthermore,
    Tie2 silencing increases, whereas Ang2 blocking inhibits transendothelial tumour cell migration in
    vitro . These results establish Ang2-mediated β1-integrin activation as a promoter of endothelial
    destablization, explaining the controversial vascular functions of Ang1 and Ang2.
