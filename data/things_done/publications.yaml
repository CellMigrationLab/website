  title: Pancreatic cancer cells breach endothelial barriers through protrusion-driven invasion or endothelial
    retraction
  authors:
  - Gautier Follain
  - Sujan Ghimire
  - Monika Vaitkevičiūtė
  - Helene Helo
  - Joanna W. Pylvänäinen
  - Frédéric Fercoq
  - Aleksi Isomursu
