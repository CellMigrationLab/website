  venue: Nano Letters
  abstract: Cellular mechanics play a crucial role in tissue homeostasis and are often misregulated in
    disease. Traction force microscopy is one of the key methods that has enabled researchers to study
    fundamental aspects of mechanobiology; however, traction force microscopy is limited by poor resolution.
    Here, we propose a simplified protocol and imaging strategy that enhances the output of traction force
    microscopy by increasing i) achievable bead density and ii) the accuracy of bead tracking. Our approach
    relies on super-resolution microscopy, enabled by fluorescence fluctuation analysis. Our pipeline
    can be used on spinning-disk confocal or widefield microscopes and is compatible with available analysis
    software. In addition, we demonstrate that our workflow can be used to gain biologically relevant
    information and is suitable for fast long-term live measurement of traction forces even in light-sensitive
    cells. Finally, using fluctuation-based traction force microscopy, we observe that filopodia align
    to the force field generated by focal adhesions.
