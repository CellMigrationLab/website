  venue: bioRxiv
  abstract: 'Actin-rich cellular protrusions direct versatile biological processes from cancer cell invasion
    to dendritic spine development. The stability, morphology and specific biological function of these
    protrusions are regulated by crosstalk between three main signaling axes: integrins, actin regulators
    and small GTPases. SHANK3 is a multifunctional scaffold protein, interacting with several actin-binding
    proteins, and a well-established autism risk gene. Recently, SHANK3 was demonstrated to sequester
    integrin-activating small GTPases Rap1 and R-Ras to inhibit integrin activity via its N-terminal SPN
    domain. Here, we demonstrate that SHANK3 interacts directly with actin using its SPN domain. Actin
    binding can be inhibited by an intramolecular closed conformation of SHANK3, where the adjacent ARR
    domain covers the actin-binding interface of the SPN domain. Actin and Rap1 compete with each other
    for binding to SHANK3 and loss of SHANK3-actin binding augments inhibition of Rap1-mediated integrin
    activity. This dynamic crosstalk has functional implications for filopodia formation in cancer cells,
    dendritic spine morphology in neurons and autism-linked phenotypes in vivo .'
