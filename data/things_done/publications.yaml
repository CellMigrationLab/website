  title: Endothelial cells cope with hypoxia-induced depletion of ATP via activation of cellular purine
    turnover and phosphotransfer networks
  authors:
  - Karolina Losenkova
  - Mariachiara Zuccarini
  - Mikko Helenius
  - Guillaume Jacquemet
  - Evgenia Gerasimovskaya
  - Camilla Tallgren
