  title: Avoiding a replication crisis in deep-learning-based bioimage analysis
  authors:
  - Romain F. Laine
  - Ignacio Arganda-Carreras
  - Ricardo Henriques
  - Guillaume Jacquemet
  venue: Nature Methods
  abstract: Deep learning algorithms are powerful tools for analyzing, restoring and transforming bioimaging
    data. One promise of deep learning is parameter-free one-click image analysis with expert-level performance
    in a fraction of the time previously required. However, as with most emerging technologies, the potential
    for inappropriate use is raising concerns among the research community. In this Comment, we discuss
    key concepts that we believe are important for researchers to consider when using deep learning for
    their microscopy studies. We describe how results obtained using deep learning can be validated and
    propose what should, in our view, be considered when choosing a suitable tool. We also suggest what
    aspects of a deep learning analysis should be reported in publications to ensure reproducibility.
    We hope this perspective will foster further discussion among developers, image analysis specialists,
    users and journal editors to define adequate guidelines and ensure the appropriate use of this transformative
    technology.
