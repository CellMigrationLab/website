  venue: Methods in Molecular Biology
  abstract: Filopodia are fingerlike membrane protrusions that are extended by cells in vitro and in vivo.
    Due to important roles in sensing the extracellular microenvironment, filopodia and filopodia-like
    protrusions have been implicated in numerous biological processes including epithelial sheet zippering
    in development and wound healing and in cancer progression. Recently, there has been an explosion
    in the number of software available to analyze specific features of cell protrusions with the aim
    of gaining mechanistic insights into the action of filopodia and filopodia-like structures. In this
    methods chapter, we highlight an open-access software called FiloQuant that has been developed to
    specifically quantify the length, density, and dynamics of filopodia and filopodia-like structures
    from in vitro and in vivo generated samples. We provide step-by-step protocols on (i) how to install
    FiloQuant in the ImageJ platform (Fiji), (ii) how to quantify filopodia and filopodia-like protrusions
    from single images using FiloQuant, and (iii) how to track filopodial protrusions from live-cell imaging
    experiments using FiloQuant and TrackMate.
