# Copied by scripts/sync_things_done.py from things_done/ledger/registries/software.yaml.
# Do not edit by hand: change things_done instead, the website updates itself.
records:
- id: ezinput
  title: EZInput
  start_date: '2026'
  github_repo_url: https://github.com/HenriquesLab/EZInput
  description: a Python library that simplifies the creation of graphical user interfaces
  summary: EZInput is a Python library for building simple interfaces for scientific computing workflows.
    Inputs are defined once and can then be used across Jupyter notebooks, Google Colab and terminal applications.
    It supports validated inputs, saved sessions and shareable parameter files, making computational workflows
    easier to run repeatedly with consistent settings.
  related_publication_dois:
  - 10.48550/arXiv.2601.08859
- id: labconstrictor
  title: LabConstrictor
  start_date: '2026'
  github_repo_url: https://github.com/CellMigrationLab/LabConstrictor
  description: From Jupyter Notebook to Desktop App in One Click
  summary: LabConstrictor turns Jupyter notebooks into installable desktop applications. It lets researchers
    share notebook-based analysis workflows with users who do not have Python, pip or a terminal set up.
    Projects remain versioned and reproducible, while LabConstrictor handles packaging, cross-platform
    installers and the application interface.
  related_publication_dois:
  - 10.48550/arXiv.2603.10704
- id: nucleisky
  title: NucleiSky
  start_date: '2026'
  github_repo_url: https://github.com/CellMigrationLab/NucleiSky
  description: Image registration and ROI matching for microscopy images using nuclei constellations.
  summary: NucleiSky registers microscopy images in 2D and 3D by matching the spatial arrangement of segmented
    nuclei. It can align partial fields of view, regions of interest or tissue subvolumes to larger reference
    images without relying on pixel-intensity similarity. It can be used through Google Colab, a desktop
    interface or directly from Python.
  related_publication_dois:
  - 10.64898/2026.06.29.735028
- id: rxiv-maker
  title: Rxiv-Maker
  start_date: '2025'
  github_repo_url: https://github.com/HenriquesLab/rxiv-maker
  description: a toolbox that converts markdown into a publication-ready PDF
  summary: Rxiv-Maker is a framework for writing scientific manuscripts in Markdown and generating publication-ready
    outputs. It handles citations, figures, LaTeX typesetting, executable code blocks, DOCX export and
    preprint submission packages. The aim is to keep manuscripts, figures, data-derived results and version
    history in sync throughout the writing process.
  related_publication_dois:
  - 10.1242/jcs.265183
- id: sred
  title: SReD
  start_date: '2025'
  github_repo_url: https://github.com/HenriquesLab/SReD
  description: Structural Repetition Detector Plugin for ImageJ and Fiji
  summary: SReD, the Structural Repetition Detector, is an ImageJ/Fiji plugin for detecting repetitive
    structures in microscopy images. It measures local structural similarity to generate maps of recurring
    patterns across different spatial scales. The method does not require labelled training data and applies
    to a range of biological structures and imaging modalities.
  related_publication_dois:
  - 10.1038/s41467-025-60709-1
- id: celltrackscolab
  title: CellTracksColab
  start_date: '2024'
  github_repo_url: https://github.com/CellMigrationLab/CellTracksColab
  description: A platform for compiling, analyzing, and exploring tracking data.
  summary: CellTracksColab brings tracking data from multiple movies, conditions and experiments into
    a single analysis workflow in Google Colab. It can be used to inspect individual tracks, compare conditions,
    analyse movement and spatial relationships, and explore high-dimensional tracking features using dimensionality
    reduction and clustering. The notebooks make these analyses accessible without requiring users to
    build an analysis pipeline from scratch.
  related_publication_dois:
  - 10.1371/journal.pbio.3002740
- id: dl4miceverywhere
  title: DL4MicEverywhere
  start_date: '2024'
  github_repo_url: https://github.com/HenriquesLab/DL4MicEverywhere
  description: An extension of ZeroCostDL4Mic featuring interactive Jupyter notebooks for bioimage analysis
    using deep learning.
  summary: DL4MicEverywhere makes deep-learning workflows for bioimage analysis portable across different
    computing environments. It provides interactive Jupyter notebooks with graphical interfaces and uses
    Docker [containers](https://hub.docker.com/repository/docker/henriqueslab/dl4miceverywhere) to reproduce
    the required software environment. Workflows can run on laptops, workstations, high-performance computing
    systems or cloud infrastructure. DL4MicEverywhere extends [ZeroCostDL4Mic](https://github.com/HenriquesLab/ZeroCostDL4Mic)
    beyond Google Colab while keeping the notebook-based interface.
  related_publication_dois:
  - 10.1038/s41592-024-02295-6
- id: nanopyx
  title: NanoPyx
  start_date: '2024'
  github_repo_url: https://github.com/HenriquesLab/NanoPyx
  description: A library for analyzing light microscopy and super-resolution data, successor to NanoJ.
  summary: NanoPyx is a Python library for analysing light-microscopy and super-resolution images. It
    builds on methods originally developed in the [NanoJ](https://github.com/HenriquesLab/NanoJ-Core)
    ecosystem and includes tools developed by the [Henriques Laboratory](https://henriqueslab.org/) and
    collaborators.
  related_publication_dois:
  - 10.1038/s41592-024-02562-6
- id: photofitt
  title: PhotoFiTT
  start_date: '2024'
  github_repo_url: https://github.com/HenriquesLab/PhotoFiTT
  description: Phototoxicity Fitness Time Trial. A Quantitative Framework for Assessing Phototoxicity
    in Live-Cells.
  summary: PhotoFiTT measures phototoxicity during live-cell microscopy. It combines a standardised imaging
    protocol with image analysis that quantifies changes in mitotic timing, cell size and cellular activity
    after light exposure. The framework helps compare imaging conditions and identify settings that preserve
    cell health while still producing useful images.
  related_publication_dois:
  - 10.1038/s41467-025-66209-6
- id: esrrf
  title: eSRRF
  start_date: '2023'
  github_repo_url: https://github.com/HenriquesLab/NanoJ-eSRRF
  description: Provides a super-resolution approach and optimal parameter prediction for super-resolution
    microscopy.
  summary: eSRRF is a fluorescence-fluctuation method for super-resolution microscopy. It reconstructs
    higher-resolution images from image sequences and includes tools for selecting reconstruction parameters.
    The parameter-selection approach helps users balance resolution, image quality and reconstruction
    artefacts across different datasets.
  related_publication_dois:
  - 10.1038/s41592-023-02057-w
- id: fast4dreg
  title: Fast4DReg
  start_date: '2023'
  github_repo_url: https://github.com/CellMigrationLab/Fast4DReg
  description: A Fiji plugin for 2D and 3D video drift correction in all axes.
  summary: Fast4DReg is a Fiji plugin for correcting drift in 2D and 3D time-lapse microscopy datasets.
    It uses intensity projections and cross-correlation to estimate displacement along the x-, y- and
    z-axes, then corrects each frame. It can also align channels in multichannel 2D and 3D datasets.
  related_publication_dois:
  - 10.1242/jcs.260728
- id: trackmate
  title: TrackMate
  start_date: '2022'
  github_repo_url: https://github.com/trackmate-sc/TrackMate
  description: Automated tracking software analyzing bioimages, distributed as a Fiji plugin.
  summary: '[TrackMate](https://imagej.net/plugins/trackmate/index) is a Fiji plugin for detecting and
    tracking objects in microscopy images. Our work has helped extend TrackMate to modern segmentation
    methods, including machine-learning and deep-learning detectors such as StarDist, and to workflows
    for tracking cells and subcellular structures.'
  related_publication_dois:
  - 10.1038/s41592-022-01507-1
- id: zerocostdl4mic
  title: ZeroCostDL4Mic
  start_date: '2021'
  github_repo_url: https://github.com/HenriquesLab/ZeroCostDL4Mic
  description: Allows the use of popular deep-learning neural networks for tasks in bioimage analysis.
  summary: '[ZeroCostDL4Mic](https://github.com/HenriquesLab/ZeroCostDL4Mic/wiki) provides notebook-based
    deep-learning workflows for microscopy that can run in Google Colab without local software installation.
    The notebooks cover common bioimage-analysis tasks including segmentation, denoising, restoration,
    super-resolution and image-to-image translation using established deep-learning models.'
  related_publication_dois:
  - 10.1038/s41467-021-22518-0
- id: filomap
  title: FiloMap
  start_date: '2019'
  github_repo_url: https://github.com/CellMigrationLab/FiloMAP
  description: ImageJ and R scripts for mapping protein localization within filopodia.
  summary: FiloMap consists of ImageJ and R scripts for measuring where proteins localise along filopodia.
    The accompanying protocols describe how to generate filopodia maps and compare the localisation patterns
    of multiple proteins.
  related_publication_dois:
  - 10.1016/j.cub.2018.11.053
  - 10.1007/978-1-0716-2887-4_4
- id: filoquant
  title: FiloQuant
  start_date: '2017'
  github_repo_url: https://github.com/CellMigrationLab/FiloQuant
  description: A Fiji plugin for automated detection and quantification of filopodia properties.
  summary: FiloQuant is a Fiji plugin for detecting and measuring filopodia in microscopy images. It measures
    properties including filopodia number, length and density. A step-by-step [methods chapter](https://doi.org/10.1007/978-1-4939-9686-5_16)
    describes workflows for analysing both isolated filopodia and filopodia-like structures in more complex
    samples.
  related_publication_dois:
  - 10.1083/jcb.201704045
  - 10.1007/978-1-4939-9686-5_16
