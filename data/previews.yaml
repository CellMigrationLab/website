# What a link to each page shows when it is pasted somewhere (Slack, Teams,
# LinkedIn, WhatsApp, email...) and what search engines show under the title.
#
#   title:        optional; the preview title (default: the page title)
#   description:  one or two sentences (about 150 characters reads best)
#   image:        a picture under docs/ (resized to a 1200 px JPEG for previews)
#
# Every page must be listed here, and every entry must be a page: the build
# stops otherwise. Featured-paper pages (/portfolio/...) use their paper's
# title, abstract and picture; `paper_image` is used when a paper has no picture.

