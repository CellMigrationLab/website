# Site-wide content: home page, footer, contact details.

name: Cell Migration Lab
motto: We study cell migration in health and disease.
tagline: Cell biology, microscopy, and image analysis.
hero:
  image: wp-content/uploads/2026/09/max_ctrl_7-processed.czi-rgb.png
intro: >-
  We study how cells move, interact with their surroundings, and cross tissue barriers. We combine
  cell biology with microscopy and quantitative image analysis, and we develop tools that make
  complex imaging experiments easier to analyse and share.


# Full-width microscopy images between the sections of the home page (two are used).
bands:
  - image: wp-content/uploads/2019/08/monolayer-1.jpg
    caption: Breast cancer cell monolayer stained for actin.
  - image: wp-content/uploads/2022/10/cover-3.jpg

# The lab's postal address (footer, structured data, llms.txt). The contact
# email is the group leader's, in data/members/<slug>.yaml.
contact:
  address:
    - Cell Migration Lab
    - Turku Bioscience Centre, BioCity
    - Tykistökatu 6
    - 20520 Turku, Finland

social:
  - label: Bluesky
    icon: bluesky
    url: https://bsky.app/profile/guijacquemet.bsky.social
  - label: GitHub
    icon: github
    url: https://github.com/CellMigrationLab
  - label: Google Scholar
    icon: scholar
    url: https://scholar.google.com/citations?user=dnBWtfsAAAAJ&hl=en
  - label: guillaume.jacquemet@abo.fi   # the address itself: not everyone has a mail app (clicking also copies it)
    icon: mail
    url: mailto:guillaume.jacquemet@abo.fi

# Logos: affiliation logos are shown in the dark footer; funding logos on white
# (home page). Both are sized to the same visual area with their proportions
# kept (scripts/cellmig/components.py logo_size); an optional `scale` (e.g.
# 1.2) corrects one whose artwork has unusual whitespace. Never stretch a file.
affiliations:
  # Which affiliations are shown comes from things_done
  # (ledger/profile/affiliations.yaml, current ones); this list adds the logo
  # and link for each, matched by the ledger `id`. A current affiliation
  # without an entry stops the build; an entry that is no longer current is
  # not shown (the build warns: remove it). Affiliations are shown in the footer,
  # so `logo` is the version for a dark background.
  # relation (for search engines and LLMs): parent = the lab is part of this
  # organisation; member = the lab belongs to this centre or network;
  # leader = an affiliation of the group leader, not of the lab.
  - id: aau-professor-bioimaging-affiliation
    relation: parent
    name: Åbo Akademi University
    url: https://www.abo.fi/en/
    logo: wp-content/uploads/2023/02/aboakademi-logo_black-300x300-1.png   # on the dark footer
    scale: 1.2   # the artwork has wide margins
  - id: turku-bioscience-centre-utuaau-affiliation
    relation: member
    name: Turku Bioscience Centre
    url: https://bioscience.fi/
    logo: wp-content/uploads/2023/02/turku_bioscience_logo_white_rgb-300x78-1.png   # on the dark footer
  - id: inflames-research-flagship-centre-affiliation
    relation: member
    name: InFLAMES Flagship
    url: https://inflames.utu.fi/
    logo: wp-content/uploads/2023/02/inflames_logo_color2.png   # on the dark footer
  - id: foundation-finnish-cancer-institute-affiliation
    relation: leader
    name: Finnish Cancer Institute
    url: https://www.syopainstituutti.com/
    logo: assets/images/logos/finnish-cancer-institute-white.png   # on the dark footer

# "Current research support" on the home page. What is shown comes from
# things_done (ledger/registries/grants.yaml, grants that are active or awarded
# and not ended, as of the last sync); these two lists add the logo and link of
# each direct funder (`funders[].name`) and each programme (`program`). The home
# page shows one row of logos in this order: each funder, then the logos of
# the programmes it alone funds (a programme's `scheme` mark first, e.g. the
# Research Council of Finland's Centres of Excellence); a joint award's funders
# come after them. Programmes without a logo are named only in llms-full.txt.
# llms-full.txt also groups them by meaning (scripts/cellmig/ledger.py
# support_list), naming a joint award's programme co-funders. A current funder
# or programme without an entry stops the build; an entry that is no longer
# current is not shown (the build warns: remove it); `hide: true` leaves out a
# current funder by choice. No amounts are shown.
# Logos: official files only; a funder with `logo: null` is shown as text.
funding:
  - funder: Research Council of Finland
    name: Research Council of Finland
    url: https://www.aka.fi/en/
    logo: assets/images/logos/research-council-of-finland.svg   # aka.fi, current brand
  - funder: Sigrid Juselius Foundation
    name: Sigrid Jusélius Foundation
    url: https://www.sigridjuselius.fi/
    logo: wp-content/uploads/2019/08/sigrid.png
  - funder: Finnish Cancer Foundation
    name: Cancer Foundation Finland
    url: https://syopasaatio.fi/
    logo: wp-content/uploads/2021/04/finnish_cancer_society.png
  - funder: Wellcome Trust
    name: Wellcome
    url: https://wellcome.org/
    logo: assets/images/logos/wellcome.svg
    scale: 0.85   # a solid block looks heavier than a word mark
  - funder: Chan Zuckerberg Initiative
    name: Chan Zuckerberg Initiative
    url: https://chanzuckerberg.com/
    logo: assets/images/logos/chan-zuckerberg-initiative.svg
  - funder: InFLAMES Flagship
    name: InFLAMES Flagship
    url: https://inflames.utu.fi/
    logo: wp-content/uploads/2023/02/inflames_logo_color.png
  - funder: IMMUDOC
    name: ImmuDocs doctoral education pilot
    url: https://sites.utu.fi/tohtorikoulutuspilotti/en/immudoc/
    logo: null
    hide: true   # owner's choice: not listed on the site

programmes:
  - program: Research Council of Finland Centre of Excellence Programme 2026–2033
    name: Centre of Excellence IMMENs
    url: https://www.helsinki.fi/en/researchgroups/immune-endothelial-interfaces
    logo: assets/images/logos/immens.png   # official logo, supplied by the IMMENs team
    scheme:   # the funding scheme's own mark, shown before the programme's logo
      name: Research Council of Finland Centres of Excellence in Research
      url: https://www.aka.fi/en/research-funding/funding-opportunities2/programmes-and-other-funding-schemes/finnish-centres-of-excellence/
      logo: assets/images/logos/rcf-centres-of-excellence.png   # aka.fi, the programme page
  - program: Essential Open Source Software for Science (EOSS), Cycle 6
    name: Essential Open Source Software for Science (EOSS), Cycle 6
    url: https://chanzuckerberg.com/eoss/
    logo: null

footer_logo: wp-content/uploads/2023/02/g2198-8.png

