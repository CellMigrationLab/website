title: Mapping the Filopodome
date: '2019-08-23'
image: wp-content/uploads/2019/08/vasp.jpg
papers:
- 10.1016/j.cub.2018.11.053
summary: >-
  Filopodia are adhesive cellular protrusions specialized in the detection of extracellular matrix (ECM)-derived
  cues. Although ECM engagement at focal adhesions is known to trigger the recruitment of hundreds of
  proteins (“adhesome”) to fine-tune cellular behavior, the components of the filopodia adhesions remain
  undefined. Here, we performed a structured-illumination-microscopy-based screen to map the localization
  of 80 target proteins, linked to cell adhesion and migration, within myosin-X-induced filopodia. We
  demonstrate preferential enrichment of several adhesion proteins to either filopodia tips, filopodia
  shafts, or shaft subdomains, suggesting divergent, spatially restricted functions for these proteins.
  Moreover, proteins with phosphoinositide (PI) binding sites are particularly enriched in filopodia.
  This, together with the strong localization of PI(3,4)P2 in filopodia tips, predicts critical roles
  for PIs in regulating filopodia ultra-structure and function. Our mapping further reveals that filopodia
  adhesions consist of a unique set of proteins, the filopodome, that are distinct from classical nascent
  adhesions, focal adhesions, and fibrillar adhesions. Using live imaging, we observe that filopodia adhesions
  can give rise to nascent adhesions, which, in turn, form focal adhesions. We demonstrate that p130Cas
  (BCAR1) is recruited to filopodia tips via its C-terminal Cas family homology domain (CCHD) and acts
  as a mechanosensitive regulator of filopodia stability. Finally, we demonstrate that our map based on
  myosin-X-induced filopodia can be translated to endogenous filopodia and fascin- and IRSp53-mediated
  filopodia.
