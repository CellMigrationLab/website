title: Myosin-X recruits lamellipodin to filopodia tips
date: '2022-10-05'
image: wp-content/uploads/2019/08/paxillin.jpg
papers:
- 10.1242/jcs.260574
links:
- label: Read the article
  url: https://journals.biologists.com/jcs/article/136/5/jcs260574/293507/Myosin-X-recruits-lamellipodin-to-filopodia-tips
summary: >-
  Myosin-X (MYO10), a molecular motor localizing to filopodia, is thought to transport various cargo to
  filopodia tips, modulating filopodia function. Yet, only a few MYO10 cargoes have been described. Here,
  using GFP-Trap and BioID approaches combined with mass spectrometry, we identified lamellipodin (RAPH1)
  as a novel MYO10 cargo. We report that the FERM domain of MYO10 is required for RAPH1 localization and
  accumulation at filopodia tips. Previous studies have mapped RAPH1 interaction with adhesome components
  to its talin binding and Ras-association domains. Surprisingly, we find that the RAPH1 MYO10-binding
  site is not within these domains. Instead, it comprises an area with previously unknown functions. Functionally,
  RAPH1 supports MYO10 filopodia formation and stability but is not involved in regulating integrin activity
  in filopodia tips. Taken together, our data indicate a feed-forward mechanism whereby MYO10 filopodia
  are positively regulated by MYO10-mediated transport of RAPH1 to the filopodium tip.
