summary: >-
  Integrating tissue-level organisation with sub-cellular resolution and molecular information often requires
  combining multiple microscopy modalities and scales. However, aligning images acquired with different
  modalities, settings, or instruments remains challenging. Here, we introduce NucleiSky, a microscopy
  image registration framework that utilises the spatial arrangement of nuclei or other landmarks as an
  intrinsic biological fingerprint. NucleiSky represents images as constellations of centroids and aligns
  them using geometric algorithms and spatial consensus scoring. In benchmark datasets, NucleiSky could
  localise query regions within larger reference images using as few as five nuclei. We show that NucleiSky
  can locate high-magnification fields of view within low-magnification overview scans, map these alignments
  to additional channels, support live brightfield-to-fixed registration using synthetic nuclear labels,
  and guide microscope re-targeting. We further show that the same constellation-matching principle can
  be extended to 3D localisation and to non-nuclear landmarks. These findings establish local landmark
  geometry as an intrinsic spatial fingerprint that enables localisation and registration across imaging
  scales, modalities and microscopy platforms. NucleiSky is available as an open-source Python package
  and as notebook-based applications.
