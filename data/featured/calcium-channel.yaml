title: Targeting filopodia to block cancer cell invasion
date: '2019-08-23'
image: wp-content/uploads/2019/08/12g10-myo10-actin-rgb-2.jpg
papers:
- 10.1038/ncomms13297
summary: >-
  Mounting in vitro, in vivo and clinical evidence suggest an important role for filopodia in driving
  cancer cell invasion. Using a high-throughput microscopic-based drug screen, we identify FDA-approved
  calcium channel blockers (CCBs) as potent inhibitors of filopodia formation in cancer cells. Unexpectedly,
  we discover that L-type calcium channels are functional and frequently expressed in cancer cells suggesting
  a previously unappreciated role for these channels during tumorigenesis. We further demonstrate that,
  at filopodia, L-type calcium channels are activated by integrin inside-out signalling, integrin activation
  and Src. Moreover, L-type calcium channels promote filopodia stability and maturation into talin-rich
  adhesions through the spatially restricted regulation of calcium entry and subsequent activation of
  the protease calpain-1. Altogether we uncover a novel and clinically relevant signalling pathway that
  regulates filopodia formation in cancer cells and propose that cycles of filopodia stabilization, followed
  by maturation into focal adhesions, directs cancer cell migration and invasion.
