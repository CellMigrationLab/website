title: Produce cell-derived matrices for migration studies
date: '2019-08-23'
image: wp-content/uploads/2019/08/guillaume-drug-cdm-01-0006_aa02_03_p000001t00000023z001c01.jpg
papers:
- 10.1038/nprot.2017.107
summary: "2D surfaces offer simple analysis of cells in culture, yet these often  \nyield different cell\
  \ morphologies and responses from those observed in vivo.\n  Considerable effort has therefore been\
  \ expended on the generation of  \nmore tissue-like environments for the study of cell behavior in vitro.\
  \ Purified matrix proteins provide a 3D scaffold that better mimics the in vivo situation; however,\
  \ these are far removed from the complex tissue composition seen in vivo. Cell-derived matrices (CDMs)\
  \ offer a more physiologically relevant alternative for studying in vivo -like cell behavior in vitro.\n\
  \  In the protocol described here, fibroblasts cultured on gelatin-coated\n  surfaces are maintained\
  \ in the presence of ascorbic acid to strengthen\n  matrix deposition over 1–3 weeks. The resulting\
  \ fibrillar CDMs are  \ndenuded of cells, and other cells are subsequently cultured on them,  \nafter\
  \ which their behavior is monitored. We also demonstrate how to use \n CDMs as an in vivo -relevant\
  \ reductionist model for studying tumor-stroma-induced changes in carcinoma cell proliferation and migration."
