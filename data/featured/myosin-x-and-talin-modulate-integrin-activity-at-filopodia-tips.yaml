title: Myosin-X and talin modulate integrin activity at filopodia tips
date: '2021-04-30'
image: wp-content/uploads/2021/04/sem_filopodia.png
papers:
- 10.1016/j.celrep.2021.109716
links:
- label: Read the article
  url: https://www.sciencedirect.com/science/article/pii/S2211124721011657
summary: >-
  Filopodia assemble unique integrin-adhesion complexes to sense the extracellular matrix. However, the
  mechanisms of integrin regulation in filopodia are poorly defined. Here, we report that active integrins
  accumulate at the tip of myosin-X (MYO10)-positive filopodia, while inactive integrins are uniformly
  distributed. We identify talin and MYO10 as the principal integrin activators in filopodia. In addition,
  deletion of MYO10’s FERM domain, or mutation of its β1-integrin-binding residues, reveals MYO10 as facilitating
  integrin activation, but not transport, in filopodia. However, MYO10’s isolated FERM domain alone cannot
  activate integrins, potentially because of binding to both integrin tails. Finally, because a chimera
  construct generated by swapping MYO10-FERM by talin-FERM enables integrin activation in filopodia, our
  data indicate that an integrin-binding FERM domain coupled to a myosin motor is a core requirement for
  integrin activation in filopodia. Therefore, we propose a two-step integrin activation model in filopodia:
  receptor tethering by MYO10 followed by talin-mediated integrin activation.
