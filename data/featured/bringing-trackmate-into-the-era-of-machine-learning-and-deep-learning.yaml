summary: >-
  TrackMate is an automated tracking software used to analyze bioimages and is distributed as a Fiji plugin.
  Here, we introduce a new version of TrackMate. TrackMate 7 is built to address the broad spectrum of
  modern challenges researchers face by integrating state-of-the-art segmentation algorithms into tracking
  pipelines. We illustrate qualitatively and quantitatively that these new capabilities function effectively
  across a wide range of bio-imaging experiments.
