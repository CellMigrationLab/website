summary: >-
  Cell–cell communication in tissues is influenced by contact geometry and molecular signalling. Here,
  we demonstrate that epithelial intercellular filopodia can penetrate neighbouring cells to form micrometre-long,
  double-membrane “impact sites” and, in some instances, initiate trans-endocytosis. Using super-resolution
  live imaging and three-dimensional electron microscopy in cell models, xenografts, and patient-derived
  tissues, we observe widespread intercellular filopodia and extensive interdigitation at the cell-cell
  interface. Filopodia impact sites in the recipient cell recruit PACSIN2 into dynamic “PACSIN2 fingers”
  and are specifically enriched for caveolin-1 and dynamin-2, while clathrin and CLIC pathway markers
  are not enriched. Most contacts are transient and resolved by retraction, but some undergo scission,
  with recipient cells internalising filopodial tips across both homotypic and heterotypic interactions,
  including cancer–endothelium contacts. Correlative light and FIB–SEM analysis reveals that internalised
  tips are often double-membraned, closely associated with endoplasmic reticulum tubules, and can traffic
  to lysosomes. These findings define a protrusion-driven, curvature-dependent uptake pathway at cell–cell
  interfaces and identify filopodia as exchange organelles in epithelial collectives.
