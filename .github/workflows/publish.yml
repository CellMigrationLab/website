name: Build and publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Resized images are slow to make; keep them between builds.
      - name: Restore image thumbnails
        uses: actions/cache@v4
        with:
          path: docs/assets/thumbs
          key: thumbs-${{ hashFiles('docs/wp-content/**', 'docs/assets/images/**', 'data/photos/**') }}
          restore-keys: thumbs-

      - name: Unit tests
        run: PYTHONPATH=scripts python -m unittest discover -s tests

      - name: Generate pages from data/
        run: python scripts/build_pages.py

      - name: Build site
        run: zensical build --strict

      # Zensical's sitemap lists only menu pages; list every page instead.
      - name: Sitemap and robots.txt
        run: python scripts/write_sitemap.py

      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/
          retention-days: 14

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
