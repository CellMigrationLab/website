name: Lab member profile
description: Add or update your photo and links on the Lab members page.
title: "Lab member: "
labels: ["lab member"]
body:
  - type: markdown
    attributes:
      value: |
        Your **name, role and whether you are a current member or alumni** come from the lab roster
        (things_done, `ledger/profile/lab_members.yaml`), which Guillaume keeps up to date. If they are
        wrong, say so under "Anything else".

        This form is for what the website adds: your photo, links and a one-line description, stored
        in `data/members/<your-name>.yaml` and `data/photos/`. Leave fields empty that you do not want
        to show. **Attach your photo** (square, at least 600 × 600 px) by dragging it into the "Photo" box.
  - type: input
    id: name
    attributes:
      label: Name
      description: As on the Lab members page.
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Photo
      description: Drag and drop an image here.
  - type: input
    id: orcid
    attributes:
      label: ORCID iD
      placeholder: 0000-0000-0000-0000
  - type: input
    id: links
    attributes:
      label: Other links (optional)
      description: Email, GitHub, Bluesky, Google Scholar or personal website, separated by spaces.
  - type: input
    id: bio
    attributes:
      label: One-line description (optional)
      placeholder: "e.g. Filopodia and cancer cell invasion"
  - type: input
    id: now
    attributes:
      label: For alumni — where are you now? (optional)
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: For example a wrong role or name spelling on the page.
